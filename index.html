<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sphere - My SNS</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
    <!-- ログイン画面（未ログイン時に全画面表示） -->
    <div id="loginOverlay" class="login-overlay">
        <div class="login-card">
            <div class="login-logo">
                <h1>Sphere</h1>
                <p>自分だけのクローズド空間</p>
            </div>
            <div class="login-form">
                <input type="email" id="loginEmail" placeholder="メールアドレス" required>
                <input type="password" id="loginPassword" placeholder="パスワード" required>
                <div id="loginError" class="login-error"></div>
                <button id="loginBtn" class="btn-primary login-btn">ログイン</button>
            </div>
        </div>
    </div>

    <div class="app-container" id="appContainer" style="display: none;">
        <!-- サイドバー (ナビゲーション等) -->
        <aside class="sidebar">
            <div class="logo">
                <h1>Sphere</h1>
            </div>
            <nav class="nav-menu">
                <a href="#" id="navHome" class="nav-item active">ホーム</a>
                <a href="#" id="navSearch" class="nav-item">検索</a>
                <a href="#" id="navNotifications" class="nav-item">通知</a>
                <a href="#" id="navProfile" class="nav-item">プロフィール</a>
                <a href="#" id="navSettings" class="nav-item">設定</a>
                <a href="#" id="navDeleted" class="nav-item" style="color: #f4212e;">ゴミ箱</a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-secondary logout-btn">ログアウト</button>
            </div>
        </aside>

        <!-- メインコンテンツ -->
        <main class="main-content">
            <header class="header">
                <h2 id="pageTitle">ホーム</h2>
            </header>

            <!-- ホーム画面 -->
            <div id="homePage">
                <!-- 投稿フォーム -->
                <section class="post-form-container">
                    <div class="avatar">
                        <!-- アバター画像はプレースホルダーAPIを利用 -->
                        <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User Avatar">
                    </div>
                    <div class="form-wrapper">
                        <textarea id="postInput" placeholder="いまどうしてる？" rows="1"></textarea>
                        
                        <!-- メディアプレビュー領域 -->
                        <div id="mediaPreviewContainer" class="media-preview-container" style="display: none;">
                            <div id="mediaPreviewGrid" class="media-preview-grid"></div>
                        </div>

                        <div class="form-actions">
                            <div class="action-icons">
                                <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display: none;">
                                <button id="attachMediaBtn" class="icon-btn" title="メディアを添付">
                                    <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-svg"><g><path d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13zM19 15.414l-3-3-5 5-3-3-3 3V18.5c0 .276.224.5.5.5h13c.276 0 .5-.224.5-.5v-3.086zM9.75 7C8.784 7 8 7.784 8 8.75s.784 1.75 1.75 1.75 1.75-.784 1.75-1.75S10.716 7 9.75 7z"></path></g></svg>
                                </button>
                                <div class="location-toggle-container">
                                    <label class="toggle-switch" title="位置情報を付与">
                                        <input type="checkbox" id="locationToggle" checked>
                                        <span class="slider round"></span>
                                    </label>
                                    <span class="toggle-label">📍</span>
                                </div>
                            </div>
                            <div class="submit-group">
                                <span class="char-count" id="charCount">0</span>
                                <button id="postBtn" class="btn-primary" disabled>ツイートする</button>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- タイムライン -->
                <section id="timeline" class="timeline">
                    <!-- Javascriptで投稿がここに挿入されます -->
                </section>
            </div>

            <!-- 削除済み一覧画面 -->
            <div id="deletedPage" style="display: none;">
                <section id="deletedTimeline" class="timeline">
                    <!-- Javascriptで削除済み投稿がここに挿入されます -->
                </section>
            </div>

            <!-- 設定（インポート/エクスポート）画面 -->
            <div id="settingsPage" style="display: none;">
                <section class="settings-section">
                    <h3>X (Twitter) アーカイブのインポート</h3>
                    <p class="settings-desc">
                        ダウンロードしたXのアーカイブファイル（ZIP形式）を選択してください。<br>
                        ※期間を指定して分割インポートが可能です。メディアも一緒にインポートされます。
                    </p>
                    <div class="import-container">
                        <input type="file" id="importFileInput" accept=".zip" class="file-input">
                        
                        <div id="importOptions" style="display: none; margin-top: 15px; padding: 15px; background: rgba(255,255,255,0.05); border-radius: 8px;">
                            <label for="importYearMonth" style="color: #e7e9ea; font-size: 14px;">インポート対象期間:</label>
                            <select id="importYearMonth" class="form-select" style="margin-left: 10px; padding: 8px; border-radius: 4px; background: #000; color: #fff; border: 1px solid #333;">
                                <option value="all">すべて</option>
                                <!-- JSで動的に追加される -->
                            </select>
                            
                            <button id="calculateImportBtn" class="btn-secondary" style="margin-left: 10px;">容量と件数を計算</button>
                        </div>
                        
                        <div id="importCalculationResult" class="import-status" style="display: none; margin-top: 15px; padding: 15px; background: rgba(29, 155, 240, 0.1); border-left: 4px solid #1d9bf0;">
                            <!-- 計算結果表示 -->
                        </div>

                        <div style="margin-top: 20px;">
                            <button id="importBtn" class="btn-primary" disabled>インポートを開始</button>
                        </div>
                    </div>
                    
                    <div id="importProgress" class="import-status" style="display: none; margin-top: 20px;">
                        <div class="progress-text" id="importProgressText" style="margin-bottom: 8px; font-size: 14px;">準備中...</div>
                        <div class="progress-bar-container" style="width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden;">
                            <div class="progress-bar" id="importProgressBar" style="width: 0%; height: 100%; background: #1d9bf0; transition: width 0.3s;"></div>
                        </div>
                    </div>
                </section>

                <section class="settings-section" style="margin-top: 40px; padding-top: 30px; border-top: 1px solid #2f3336;">
                    <h3>エクスポート</h3>
                    <p class="settings-desc">
                        このアプリの全データをXのアーカイブと同じ構成（ZIPファイル）でダウンロードします。
                    </p>
                    <button id="exportBtn" class="btn-secondary" style="margin-top: 10px;">アーカイブをダウンロード</button>
                </section>
            </div>
        </main>
        
        <!-- 右サイドバー (トレンド等) -->
        <aside class="right-sidebar">
            <div class="widget">
                <h3>おすすめトレンド</h3>
                <p class="empty-text">ここにトレンドが表示されます</p>
            </div>
        </aside>
    </div>

    <!-- 画像拡大プレビュー用モーダル -->
    <div id="imageModal" class="image-modal">
        <button id="closeImageModalBtn" class="close-modal-btn">×</button>
        <img id="modalImage" class="modal-image" src="" alt="拡大画像">
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
